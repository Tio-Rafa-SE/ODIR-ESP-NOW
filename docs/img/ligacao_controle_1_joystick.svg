<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="t d">
  <title id="t">Ligação do controle com 1 joystick</title>
  <desc id="d">Cinco fios do módulo joystick ao ESP32: o pino de alimentação do joystick vai no 3V3, GND no GND, VRx no GPIO32, VRy no GPIO33 e SW no GPIO25.</desc>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
    .titulo { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .pino { font-size: 14px; font-weight: 700; }
    .peq { font-size: 12.5px; fill: #475569; }
    .placa { fill: #ecfdf5; stroke: #0f766e; stroke-width: 2.5; }
    .joy { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; }
    .pbox { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .vcc { stroke: #dc2626; stroke-width: 3.5; fill: none; }
    .gnd { stroke: #111827; stroke-width: 3.5; fill: none; }
    .eixoy { stroke: #0f766e; stroke-width: 3.5; fill: none; }
    .eixox { stroke: #d97706; stroke-width: 3.5; fill: none; }
    .sw { stroke: #7c3aed; stroke-width: 3.5; fill: none; }
    .nota { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
    .alerta { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
  </style>
  <rect width="920" height="560" fill="#f8fafc"/>

  <!-- ESP32 -->
  <rect class="placa" x="40" y="40" width="260" height="330" rx="14"/>
  <text class="titulo" x="170" y="72">ESP32 (DevKit) - CONTROLE</text>
  <rect class="pbox" x="190" y="100" width="110" height="34" rx="5"/><text class="pino" x="200" y="123">3V3</text>
  <rect class="pbox" x="190" y="150" width="110" height="34" rx="5"/><text class="pino" x="200" y="173">GND</text>
  <rect class="pbox" x="190" y="200" width="110" height="34" rx="5"/><text class="pino" x="200" y="223">GPIO32</text>
  <rect class="pbox" x="190" y="250" width="110" height="34" rx="5"/><text class="pino" x="200" y="273">GPIO33</text>
  <rect class="pbox" x="190" y="300" width="110" height="34" rx="5"/><text class="pino" x="200" y="323">GPIO25</text>
  <text class="peq" x="52" y="223">direção (X)</text>
  <text class="peq" x="52" y="273">acelerador (Y)</text>
  <text class="peq" x="52" y="323">botão: troca de modo</text>

  <!-- Joystick -->
  <rect class="joy" x="620" y="40" width="260" height="330" rx="14"/>
  <text class="titulo" x="750" y="72">Módulo joystick (único)</text>
  <rect class="pbox" x="620" y="100" width="110" height="34" rx="5"/><text class="pino" x="632" y="123">+5V</text>
  <rect class="pbox" x="620" y="150" width="110" height="34" rx="5"/><text class="pino" x="632" y="173">GND</text>
  <rect class="pbox" x="620" y="200" width="110" height="34" rx="5"/><text class="pino" x="632" y="223">VRx</text>
  <rect class="pbox" x="620" y="250" width="110" height="34" rx="5"/><text class="pino" x="632" y="273">VRy</text>
  <rect class="pbox" x="620" y="300" width="110" height="34" rx="5"/><text class="pino" x="632" y="323">SW</text>
  <text class="peq" x="742" y="123">(ligar no 3V3!)</text>
  <text class="peq" x="742" y="223">esquerda/direita</text>
  <text class="peq" x="742" y="273">frente/trás</text>
  <text class="peq" x="742" y="323">botão do polegar</text>

  <!-- Fios -->
  <path class="vcc" d="M300,117 L620,117"/>
  <path class="gnd" d="M300,167 L620,167"/>
  <path class="eixox" d="M300,217 L620,217"/>
  <path class="eixoy" d="M300,267 L620,267"/>
  <path class="sw" d="M300,317 L620,317"/>

  <!-- Notas -->
  <rect class="alerta" x="40" y="400" width="420" height="140" rx="10"/>
  <text class="pino" x="54" y="426">Atenção: 3V3, não 5V</text>
  <text class="peq" x="54" y="448">O módulo vem marcado com "+5V", mas aqui ele é ligado no 3V3 do</text>
  <text class="peq" x="54" y="466">ESP32. Com 5V, os eixos podem entregar mais de 3,3 V ao pino</text>
  <text class="peq" x="54" y="484">analógico e danificar a placa. O ESP32 trabalha com sinais de 3,3 V.</text>
  <text class="peq" x="54" y="508">Joystick no lugar errado (X e Y trocados)? Não mexa nos fios:</text>
  <text class="peq" x="54" y="526">troque INVERTER_* no config_controle.h e rode o Passo 2.</text>
  <rect class="nota" x="490" y="400" width="390" height="140" rx="10"/>
  <text class="pino" x="504" y="426">Resumo (1 joystick)</text>
  <text class="peq" x="504" y="448">VRy -> GPIO33   (frente/trás = acelerador)</text>
  <text class="peq" x="504" y="466">VRx -> GPIO32   (esquerda/direita = direção)</text>
  <text class="peq" x="504" y="484">SW  -> GPIO25   (apertar troca o modo)</text>
  <text class="peq" x="504" y="508">Mesmo firmware da versão com 2 joysticks.</text>
  <text class="peq" x="504" y="526">Só a fiação muda.</text>
</svg>
