<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Os dois modos de condução</title>
  <desc id="d">No modo DIREÇÕES, o carro faz quatro movimentos em velocidade cheia, com frente e ré tendo prioridade sobre os giros. No modo MISTO, acelerador e direção atuam juntos e a velocidade é proporcional ao quanto a alavanca é empurrada.</desc>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .tit { font-size: 18px; font-weight: 700; }
    .nome { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #334155; }
    .reta { fill: #d1fae5; stroke: #0f766e; stroke-width: 2; }
    .giro { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
    .curva { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parado { fill: #e2e8f0; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 5; }
    .painel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
  </style>
  <rect width="960" height="520" fill="#f8fafc"/>

  <!-- Painel DIRECOES -->
  <rect class="painel" x="20" y="20" width="450" height="480" rx="14"/>
  <text class="tit" x="245" y="52">Modo DIREÇÕES (como no vídeo)</text>
  <text class="sub" x="245" y="72">velocidade cheia | frente e ré ganham dos giros</text>
  <rect class="curva" x="40" y="90" width="130" height="110" rx="8"/>
  <text class="nome" x="105" y="140">Frente</text><text class="sub" x="105" y="158">(a frente ganha)</text>
  <rect class="reta" x="170" y="90" width="130" height="110" rx="8"/>
  <text class="nome" x="235" y="140">FRENTE</text><text class="sub" x="235" y="158">reta, 100%</text>
  <rect class="curva" x="300" y="90" width="130" height="110" rx="8"/>
  <text class="nome" x="365" y="140">Frente</text><text class="sub" x="365" y="158">(a frente ganha)</text>
  <rect class="giro" x="40" y="200" width="130" height="110" rx="8"/>
  <text class="nome" x="105" y="250">Gira à esq.</text><text class="sub" x="105" y="268">no lugar</text>
  <rect class="parado" x="170" y="200" width="130" height="110" rx="8"/>
  <text class="nome" x="235" y="250">PARADO</text><text class="sub" x="235" y="268">abaixo de 40%</text>
  <rect class="giro" x="300" y="200" width="130" height="110" rx="8"/>
  <text class="nome" x="365" y="250">Gira à dir.</text><text class="sub" x="365" y="268">no lugar</text>
  <rect class="curva" x="40" y="310" width="130" height="110" rx="8"/>
  <text class="nome" x="105" y="360">Ré</text><text class="sub" x="105" y="378">(a ré ganha)</text>
  <rect class="reta" x="170" y="310" width="130" height="110" rx="8"/>
  <text class="nome" x="235" y="360">RÉ</text><text class="sub" x="235" y="378">reta, 100%</text>
  <rect class="curva" x="300" y="310" width="130" height="110" rx="8"/>
  <text class="nome" x="365" y="360">Ré</text><text class="sub" x="365" y="378">(a ré ganha)</text>
  <text class="sub" x="245" y="450">Linhas: acelerador (cima = frente). Colunas: direção.</text>
  <text class="sub" x="245" y="470">Limiar de 40% ajustável em LIMIAR_DIRECOES_PCT.</text>

  <!-- Painel MISTO -->
  <rect class="painel" x="490" y="20" width="450" height="480" rx="14"/>
  <text class="tit" x="715" y="52">Modo MISTO (acelerador + direção)</text>
  <text class="sub" x="715" y="72">velocidade proporcional | os dois eixos juntos</text>
  <rect class="curva" x="510" y="90" width="130" height="110" rx="8"/>
  <text class="nome" x="575" y="135">Curva à esq.</text><text class="sub" x="575" y="153">andando</text>
  <rect class="reta" x="640" y="90" width="130" height="110" rx="8"/>
  <text class="nome" x="705" y="135">FRENTE</text><text class="sub" x="705" y="153">50% de curso = 50%</text>
  <rect class="curva" x="770" y="90" width="130" height="110" rx="8"/>
  <text class="nome" x="835" y="135">Curva à dir.</text><text class="sub" x="835" y="153">andando</text>
  <rect class="giro" x="510" y="200" width="130" height="110" rx="8"/>
  <text class="nome" x="575" y="250">Gira à esq.</text><text class="sub" x="575" y="268">proporcional</text>
  <rect class="parado" x="640" y="200" width="130" height="110" rx="8"/>
  <text class="nome" x="705" y="250">PARADO</text><text class="sub" x="705" y="268">zona morta (10%)</text>
  <rect class="giro" x="770" y="200" width="130" height="110" rx="8"/>
  <text class="nome" x="835" y="250">Gira à dir.</text><text class="sub" x="835" y="268">proporcional</text>
  <rect class="curva" x="510" y="310" width="130" height="110" rx="8"/>
  <text class="nome" x="575" y="355">Ré + esq.</text><text class="sub" x="575" y="373">curva de ré</text>
  <rect class="reta" x="640" y="310" width="130" height="110" rx="8"/>
  <text class="nome" x="705" y="355">RÉ</text><text class="sub" x="705" y="373">proporcional</text>
  <rect class="curva" x="770" y="310" width="130" height="110" rx="8"/>
  <text class="nome" x="835" y="355">Ré + dir.</text><text class="sub" x="835" y="373">curva de ré</text>
  <text class="sub" x="715" y="450">Com 1 joystick, a diagonal faz a curva. Com 2 joysticks,</text>
  <text class="sub" x="715" y="470">cada mão cuida de um eixo e a curva sai da combinação.</text>
</svg>
